<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3275" />
    <title>Sem conexao | Espaco Personalize PDV</title>
    <style>
      :root {
        color: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        align-items: center;
        background: #f6f7fb;
        display: flex;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        box-shadow: 0 1px 2px rgb(15 23 42 / 8%);
        margin: 0 auto;
        max-width: 420px;
        padding: 24px;
      }

      img {
        display: block;
        height: auto;
        margin-bottom: 24px;
        width: 128px;
      }

      p:first-of-type {
        color: #1e3275;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 0;
        text-transform: uppercase;
      }

      h1 {
        font-size: 24px;
        line-height: 1.2;
        margin: 8px 0 12px;
      }

      p {
        color: #475569;
        font-size: 15px;
        line-height: 1.6;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/ep-logo-site.png" alt="Espaco Personalize" />
      <p>Sem conexao</p>
      <h1>Conecte-se para continuar usando o PDV.</h1>
      <p>
        Vendas, caixa, estoque e relatorios dependem de conexao com o servidor.
        Assim que a internet voltar, recarregue a pagina.
      </p>
    </main>
  </body>
</html>
