name: Quality

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Commit message lint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Push commit message lint
        if: github.event_name == 'push'
        run: npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Verify no event legacy
        run: npm run test:no-event-legacy

      - name: Build
        run: npm run build
        env:
          # The build prerenders authenticated routes that initialize the
          # Supabase client. CI only needs valid public configuration shapes;
          # it must not depend on production credentials or expose secret keys.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key

  database:
    name: Database contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: local-supabase-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Start local Supabase
        # The command normally prints ephemeral local keys. They are not needed
        # by later steps because the database gate reads them in memory.
        run: npx supabase start >/dev/null
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"

      - name: Run database gate
        run: npm run test:db
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"
