name: E2E Release Gate

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-supabase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase
        # Keep ephemeral CLI keys in memory inside the gate, out of CI logs.
        run: npx supabase start >/dev/null

      - name: Run required E2E suite
        id: e2e
        run: npm run test:e2e:local-reset

      - name: Upload Playwright failure artifacts
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
